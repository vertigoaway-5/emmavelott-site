name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Build site (covers, home, book pages, sitemap, 404)
        run: python3 build.py

      - name: Save full-size covers to the cover-sources branch
        run: |
          mkdir -p /tmp/cs && cp /tmp/*.src /tmp/cs/ || exit 0
          cd /tmp/cs && git init -q && git checkout -q -b cover-sources
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "cover sources"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cover-sources

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
