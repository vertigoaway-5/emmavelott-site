name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Build site (covers, home, book pages, sitemap, 404)
        run: python3 build.py

      - name: Keep full-size covers (private build artifact, not published)
        run: mkdir -p covers_src && cp /tmp/*.src covers_src/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: covers-src
          path: covers_src
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
