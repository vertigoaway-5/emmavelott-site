name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and resize book covers from Gumroad
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p _site/covers
          fetch () {
            curl -fsSL "https://public-files.gumroad.com/$1" -o "/tmp/$2.src"
            convert "/tmp/$2.src" -resize 500x800^ -gravity center -extent 500x800 -strip -quality 82 "_site/covers/$2.jpg"
          }
          fetch bzmswl2icknk9bis5xjgzcuwaxtu the-rakish-viscounts-pretend-wife
          fetch fbaagnog4okhgmo6adsfo31mhzhs a-fiery-widow-for-the-cold-duke
          fetch 2hnzs26m8lghuwo40n556uyzwjct a-jilted-bride-for-the-battle-scarred-duke
          ls -la _site/covers

      - name: Copy site files
        run: |
          cp index.html robots.txt sitemap.xml _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
